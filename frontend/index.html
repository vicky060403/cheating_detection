<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exam Monitoring — Cheating Detection</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Exam Monitoring Dashboard</h1>
    <div class="status-pill" id="connectionStatus">connecting…</div>
  </header>

  <main class="layout">
    <section class="cameras-panel">
      <div class="panel-header">
        <h2>Live Cameras</h2>
        <button id="addCameraBtn" class="btn">+ Add Camera</button>
      </div>
      <div id="cameraGrid" class="camera-grid"></div>
    </section>

    <aside class="alerts-panel">
      <div class="panel-header">
        <h2>Cheating Alerts</h2>
        <span id="alertCount" class="badge">0</span>
      </div>
      <div id="alertsList" class="alerts-list"></div>
    </aside>
  </main>

  <div id="addCameraModal" class="modal hidden">
    <div class="modal-box">
      <h3>Add Camera</h3>
      <label>Camera name<input id="newCamName" placeholder="e.g. Classroom-101" /></label>
      <label>RTSP URL or source<input id="newCamSource" placeholder="rtsp://user:password@camera-ip:554/stream1" /></label>
      <div class="modal-actions">
        <button id="cancelAddCam" class="btn secondary">Cancel</button>
        <button id="testCameraBtn" class="btn secondary">Test connection</button>
        <button id="confirmAddCam" class="btn">Add camera</button>
      </div>
      <p id="addCamError" class="error"></p>
    </div>
  </div>

  <div id="snapshotModal" class="modal snapshot-modal hidden" role="dialog" aria-modal="true" aria-labelledby="snapshotTitle">
    <div class="snapshot-box">
      <div class="snapshot-header">
        <h3 id="snapshotTitle">Alert snapshot</h3>
        <button id="closeSnapshot" class="close-btn" type="button" aria-label="Close snapshot">&times;</button>
      </div>
      <img id="snapshotPreview" class="snapshot-preview" alt="Enlarged cheating alert snapshot" />
      <div class="snapshot-actions">
        <span id="snapshotStatus" class="snapshot-status"></span>
        <button id="verifySnapshot" class="btn" type="button">Mark as verified</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
